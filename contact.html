<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Ferrous Ink</title><meta name="description" content="Contact Ferrous Ink for book inquiries, reader messages, and correspondence."><link rel="stylesheet" href="assets/css/styles.css"></head>
<body><header class="site-header"><nav class="nav">
<a class="brand" href="index.html" aria-label="Ferrous Ink home"><img src="assets/images/ferrous-ink-logo-fixed.svg" alt="Ferrous Ink"></a>
<div class="nav-links"><a href="index.html">Home</a><a href="books.html">Books</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></div></nav></header><main>
<section class="section contact-page">
 <div class="contact-intro">
  <p class="eyebrow">Correspondence</p>
  <h1>Contact</h1>
  <p class="contact-lead">For book inquiries, reader messages, and other correspondence, please use the form.</p>
  <div class="contact-rule"></div>
 </div>
 <div class="contact-card">
  <form class="form" id="contact-form" action="https://formspree.io/f/xyekgvqp" method="POST">
   <div class="form-row">
    <div><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="100" required></div>
    <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
   </div>
   <label for="subject">Subject</label><input id="subject" name="subject" maxlength="150" required>
   <label for="message">Message</label><textarea id="message" name="message" maxlength="500" aria-describedby="message-count" required></textarea>
   <div id="message-count" class="notice" style="text-align:right;margin-top:-.6rem">0 / 500 characters</div>
   <div aria-hidden="true" style="position:absolute;left:-9999px"><label>Leave this field empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
   <button class="button contact-button" type="submit" id="contact-submit">Send Message</button>
   <p class="notice" id="form-note" role="status" aria-live="polite">All fields are required. Maximum message length: 500 characters.</p>
  </form>
 </div>
</section></main><footer><div class="footer-inner"><div>FERROUS INK · Books by Tvisha</div><div>© <span data-year></span> Ferrous Ink. All rights reserved.</div></div></footer><script src="assets/js/site.js"></script></body></html>
