name: Install author image
on:
  push:
    paths:
      - '.image-upload/ready'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode author image
        run: |
          cat .image-upload/chunk-*.txt | base64 --decode > assets/images/author-still-life.jpg
          rm -rf .image-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/author-still-life.jpg .image-upload
          git commit -m "Add high-resolution author still life"
          git push